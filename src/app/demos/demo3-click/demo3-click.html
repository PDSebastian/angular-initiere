<h1>Eveniment (click)</h1>
<button (click)="increment()">Apasă {{ x }}</button>
<button (click)="incrementLater()">+1 peste 2 secunde</button>
<p class="hint">
  Primul buton actualizează ecranul: click-ul din template îi spune lui Angular să redeseneze. Al
  doilea schimbă x într-un setTimeout: în consolă x crește, dar pe ecran apare abia la următorul
  click, pentru că Angular nu află de schimbare.
</p>
